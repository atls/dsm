name: DSM
on:
  schedule:
    # every day at 4:00 UTC (7:00 MSK)
    - cron: "0 4 * * *"
    
  workflow_dispatch:

jobs:
  dsm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.DSM_APP_ID }}
          private-key: ${{ secrets.DSM_APP_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: Download pinned DSM launcher
        env:
          DSM_LAUNCHER_SHA256: a5c236943d995026d9e550749c9fc5ccc773449df6e7ead691b649cd6ae87ad5
        run: |
          curl --fail --location --silent --show-error \
            --output dsm-launcher-x86_64-unknown-linux-musl.tar.gz \
            https://github.com/atls/dsm/releases/download/%40atls%2Fdsm%400.1.0/dsm-launcher-x86_64-unknown-linux-musl.tar.gz
          echo "${DSM_LAUNCHER_SHA256}  dsm-launcher-x86_64-unknown-linux-musl.tar.gz" | sha256sum --check
          tar -xzf dsm-launcher-x86_64-unknown-linux-musl.tar.gz

      - name: Run DSM launcher
        run: ./dsm-launcher
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
